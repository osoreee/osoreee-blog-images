<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0F766E"/>
    </marker>
    <style>
      text { font-family: Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="800" height="500" fill="#F8FAFC"/>

  <!-- Header -->
  <rect x="0" y="0" width="800" height="70" fill="#0F766E"/>
  <text x="400" y="34" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="bold" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">월세 세액공제 받는 법</text>
  <text x="400" y="55" text-anchor="middle" fill="#D1FAE5" font-size="13" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">놓치는 조건 총정리 · 절차 흐름도</text>

  <!-- Section 1: Flow -->
  <text x="40" y="92" text-anchor="start" fill="#0F766E" font-size="15" font-weight="bold" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">왜 다들 못 챙길까? — 신청까지의 흐름</text>

  <!-- Box 1 -->
  <rect x="40" y="105" width="160" height="90" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="120" y="143" text-anchor="middle" fill="#065F46" font-size="13" font-weight="bold" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">① 연말정산 시즌</text>
  <text x="120" y="165" text-anchor="middle" fill="#065F46" font-size="13" font-weight="bold" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">검색량 급증</text>

  <line x1="203" y1="150" x2="224" y2="150" stroke="#0F766E" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 2 -->
  <rect x="227" y="105" width="160" height="90" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="307" y="143" text-anchor="middle" fill="#065F46" font-size="13" font-weight="bold" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">② 조건 확인 없이</text>
  <text x="307" y="165" text-anchor="middle" fill="#065F46" font-size="13" font-weight="bold" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">신청 포기</text>

  <line x1="390" y1="150" x2="411" y2="150" stroke="#0F766E" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 3 -->
  <rect x="414" y="105" width="160" height="90" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="494" y="129" text-anchor="middle" fill="#065F46" font-size="13" font-weight="bold" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">③ 세무서·홈택스</text>
  <text x="494" y="151" text-anchor="middle" fill="#065F46" font-size="13" font-weight="bold" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">문의 폭주</text>
  <text x="494" y="176" text-anchor="middle" fill="#0F766E" font-size="10.5" font-style="italic" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">"저도 대상자인가요?"</text>

  <line x1="577" y1="150" x2="598" y2="150" stroke="#0F766E" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 4 -->
  <rect x="601" y="105" width="160" height="90" rx="10" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.5"/>
  <text x="681" y="143" text-anchor="middle" fill="#065F46" font-size="13" font-weight="bold" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">④ 대상자 중</text>
  <text x="681" y="165" text-anchor="middle" fill="#065F46" font-size="13" font-weight="bold" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">절반도 미신청</text>

  <!-- Section 2: Income brackets -->
  <text x="40" y="223" text-anchor="start" fill="#C2410C" font-size="15" font-weight="bold" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">소득 구간별 공제율</text>

  <rect x="40" y="235" width="227" height="90" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
  <text x="153" y="258" text-anchor="middle" fill="#9A3412" font-size="12" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">총급여</text>
  <text x="153" y="277" text-anchor="middle" fill="#9A3412" font-size="12" font-weight="bold" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">5,500만원 이하</text>
  <text x="153" y="311" text-anchor="middle" fill="#EA580C" font-size="26" font-weight="bold" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">17%</text>

  <rect x="287" y="235" width="227" height="90" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
  <text x="400" y="258" text-anchor="middle" fill="#9A3412" font-size="12" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">총급여</text>
  <text x="400" y="277" text-anchor="middle" fill="#9A3412" font-size="12" font-weight="bold" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">5,500만~7,000만원</text>
  <text x="400" y="311" text-anchor="middle" fill="#EA580C" font-size="26" font-weight="bold" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">15%</text>

  <rect x="534" y="235" width="227" height="90" rx="10" fill="#FFF7ED" stroke="#EA580C" stroke-width="1.5"/>
  <text x="647" y="258" text-anchor="middle" fill="#9A3412" font-size="12" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">총급여</text>
  <text x="647" y="277" text-anchor="middle" fill="#9A3412" font-size="12" font-weight="bold" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">7,000만~8,000만원*</text>
  <text x="647" y="311" text-anchor="middle" fill="#EA580C" font-size="26" font-weight="bold" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">12%</text>

  <text x="40" y="343" text-anchor="start" fill="#78716C" font-size="10.5" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">*7,000만~8,000만원 구간은 성실사업자·청년 등 특례 조건 충족 시 적용</text>

  <!-- Section 3: Calculation example -->
  <rect x="40" y="358" width="720" height="90" rx="12" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="60" y="381" text-anchor="start" fill="#1D4ED8" font-size="15" font-weight="bold" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">계산 예시로 감 잡기</text>
  <text x="400" y="407" text-anchor="middle" fill="#1E3A8A" font-size="13.5" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">월세 60만원 × 12개월 = 720만원 (공제 한도 750만원 이내)</text>
  <text x="400" y="433" text-anchor="middle" fill="#DC2626" font-size="16" font-weight="bold" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">720만원 × 17% = 약 122만 4천원 세액공제</text>

  <!-- Footer -->
  <rect x="40" y="460" width="720" height="35" rx="8" fill="#0F766E"/>
  <text x="400" y="482" text-anchor="middle" fill="#FFFFFF" font-size="13.5" font-weight="bold" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">신청 대상자의 절반도 못 챙기는 혜택 — 조건부터 꼭 확인하세요</text>
</svg>