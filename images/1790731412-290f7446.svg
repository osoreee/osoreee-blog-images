<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 500" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
  <defs>
    <g id="checkIcon">
      <circle r="9" fill="#43a047"/>
      <path d="M-4,0 L-1,3.2 L4.2,-4" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="xIcon">
      <circle r="9" fill="#e53935"/>
      <path d="M-3.6,-3.6 L3.6,3.6 M3.6,-3.6 L-3.6,3.6" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    </g>
    <style>
      text { font-family: Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="800" height="500" fill="#f5f7fa"/>

  <!-- Header -->
  <rect x="0" y="0" width="800" height="90" fill="#22304a"/>
  <text x="400" y="42" text-anchor="middle" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="28" font-weight="700" fill="#ffffff">자유적금 vs 정기적금</text>
  <text x="400" y="68" text-anchor="middle" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="15" fill="#b8c7e0">사회초년생 저축법 체크리스트</text>

  <!-- Quote box -->
  <rect x="40" y="100" width="720" height="66" rx="10" fill="#fff8e1" stroke="#ffca28" stroke-width="1.5"/>
  <text x="60" y="126" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13.5" font-style="italic" fill="#7a5900">“요즘은 다들 자유적금 많이 하세요, 부담 없이 넣고 싶을 때 넣으시면 돼요”</text>
  <text x="60" y="149" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12.5" fill="#9c7a00">— 첫 직장 은행 창구에서 들은 말, 문제는 늘 그 다음이었다</text>

  <!-- Left card background -->
  <rect x="30" y="178" width="360" height="282" rx="12" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.5"/>
  <!-- Right card background -->
  <rect x="410" y="178" width="360" height="282" rx="12" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.5"/>

  <!-- Left header -->
  <path d="M30,190 Q30,178 42,178 L378,178 Q390,178 390,190 L390,215 L30,215 Z" fill="#ff8a65"/>
  <text x="210" y="203" text-anchor="middle" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="19" font-weight="700" fill="#ffffff">자유적금</text>

  <!-- Right header -->
  <path d="M410,190 Q410,178 422,178 L758,178 Q770,178 770,190 L770,215 L410,215 Z" fill="#1f6feb"/>
  <text x="590" y="203" text-anchor="middle" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="19" font-weight="700" fill="#ffffff">정기적금</text>

  <!-- Left items -->
  <use xlink:href="#checkIcon" href="#checkIcon" x="50" y="248"/>
  <text x="66" y="253" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#333333">원하는 때 자유롭게 입금 가능</text>

  <use xlink:href="#checkIcon" href="#checkIcon" x="50" y="280"/>
  <text x="66" y="285" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#333333">급여일 들쭉날쭉해도 부담 없음</text>

  <use xlink:href="#xIcon" href="#xIcon" x="50" y="312"/>
  <text x="66" y="317" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#333333">금리가 정기적금보다 낮은 편</text>

  <use xlink:href="#xIcon" href="#xIcon" x="50" y="344"/>
  <text x="66" y="349" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#333333">강제성 없어 흐지부지되기 쉬움</text>

  <rect x="45" y="365" width="330" height="75" rx="8" fill="#fff3e0" stroke="#ffb74d" stroke-width="1.5"/>
  <text x="60" y="388" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" font-weight="700" fill="#e65100">이런 분께 적합해요</text>
  <text x="60" y="410" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#5d4037">수입이 불규칙한 프리랜서·N잡러에게 추천</text>
  <text x="60" y="428" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11.5" fill="#8d6e63">(단, 저축 습관 관리는 스스로 챙겨야 해요)</text>

  <!-- Right items -->
  <use xlink:href="#checkIcon" href="#checkIcon" x="430" y="248"/>
  <text x="446" y="253" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#333333">매달 정해진 금액 자동이체</text>

  <use xlink:href="#checkIcon" href="#checkIcon" x="430" y="280"/>
  <text x="446" y="285" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#333333">금리가 더 높은 상품이 많음</text>

  <use xlink:href="#checkIcon" href="#checkIcon" x="430" y="312"/>
  <text x="446" y="317" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#333333">강제 저축으로 습관 형성 쉬움</text>

  <use xlink:href="#xIcon" href="#xIcon" x="430" y="344"/>
  <text x="446" y="349" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="14" fill="#333333">중도해지 시 이자 손해 큼</text>

  <rect x="425" y="365" width="330" height="75" rx="8" fill="#e3f2fd" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="440" y="388" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" font-weight="700" fill="#1565c0">이런 분께 적합해요</text>
  <text x="440" y="410" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" fill="#37474f">매달 고정 급여를 받는 사회초년생에게 추천</text>
  <text x="440" y="428" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11.5" fill="#546e7a">(대신 비상금은 별도로 마련해두세요)</text>

  <!-- Footer checklist -->
  <rect x="30" y="470" width="740" height="25" rx="6" fill="#22304a"/>
  <text x="400" y="487" text-anchor="middle" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="12.5" font-weight="600" fill="#ffffff">✓ 급여 패턴 확인   →   ✓ 저축 목표 기간 설정   →   ✓ 중도해지 조건 점검</text>
</svg>