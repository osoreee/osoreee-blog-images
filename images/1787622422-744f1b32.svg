<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
  <style>
    text { font-family: Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif; }
    .title { font-size: 21px; font-weight: 700; fill: #0b0b0b; }
    .badge-num { font-size: 14px; font-weight: 700; fill: #fcfcfb; }
    .box-main { font-size: 15.5px; font-weight: 700; fill: #0b0b0b; }
    .box-sub { font-size: 14px; fill: #52514e; }
    .arrow-label { font-size: 12.5px; fill: #898781; }
    .tag { font-size: 12px; font-weight: 700; }
  </style>

  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c3c2b7"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="500" fill="#f9f9f7"/>

  <text x="400" y="30" text-anchor="middle" class="title">CMA 통장 예금자보호, 다들 잘못 알고 있어요</text>

  <!-- connecting spine -->
  <line x1="400" y1="105" x2="400" y2="123" stroke="#c3c2b7" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="183" x2="400" y2="201" stroke="#c3c2b7" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="256" x2="400" y2="282" stroke="#c3c2b7" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="354" x2="400" y2="372" stroke="#c3c2b7" stroke-width="2" marker-end="url(#arrowhead)"/>

  <text x="415" y="272" class="arrow-label">그래서 오늘, 오해를 하나씩 짚어봅니다</text>
  <text x="415" y="367" class="arrow-label">그런데, 진짜 그럴까요?</text>

  <!-- Box 1: 시작 -->
  <g>
    <rect x="110" y="50" width="600" height="55" rx="8" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
    <rect x="110" y="50" width="6" height="55" rx="2" fill="#2a78d6"/>
    <circle cx="90" cy="77" r="15" fill="#2a78d6"/>
    <text x="90" y="82" text-anchor="middle" class="badge-num">1</text>
    <text x="135" y="72" class="box-main">사회초년생 재테크 이야기에 빠지지 않는 이름</text>
    <text x="135" y="92" class="box-sub">바로 &quot;CMA 통장&quot;</text>
  </g>

  <!-- Box 2: 소문 (warning) -->
  <g>
    <rect x="110" y="123" width="600" height="60" rx="8" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
    <rect x="110" y="123" width="6" height="60" rx="2" fill="#fab219"/>
    <circle cx="90" cy="153" r="15" fill="#fab219"/>
    <text x="90" y="158" text-anchor="middle" class="badge-num">2</text>
    <!-- warning triangle icon -->
    <path d="M665,138 L676,157 L654,157 Z" fill="none" stroke="#ec835a" stroke-width="2" stroke-linejoin="round"/>
    <text x="665" y="153.5" text-anchor="middle" font-size="10" font-weight="700" fill="#ec835a">!</text>
    <text x="135" y="145" class="box-main">&quot;예금자보호가 안 된다더라&quot;</text>
    <text x="135" y="165" class="box-sub">라는 말 한마디에 겁부터 먹는 사람들</text>
  </g>

  <!-- Box 3: 결과 (기피) -->
  <g>
    <rect x="110" y="201" width="600" height="55" rx="8" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
    <rect x="110" y="201" width="6" height="55" rx="2" fill="#898781"/>
    <circle cx="90" cy="228" r="15" fill="#898781"/>
    <text x="90" y="233" text-anchor="middle" class="badge-num">3</text>
    <text x="135" y="223" class="box-main">그 결과, CMA 통장을</text>
    <text x="135" y="243" class="box-sub">아예 안 쓰는 분들이 은근히 많다</text>
  </g>

  <!-- Box 4: 오해 1 (warning) -->
  <g>
    <rect x="110" y="282" width="600" height="72" rx="8" fill="#fff8ea" stroke="#fab219"/>
    <rect x="110" y="282" width="6" height="72" rx="2" fill="#fab219"/>
    <circle cx="90" cy="318" r="15" fill="#fab219"/>
    <text x="90" y="323" text-anchor="middle" class="badge-num">4</text>
    <path d="M672,297 L684,317 L660,317 Z" fill="none" stroke="#ec835a" stroke-width="2" stroke-linejoin="round"/>
    <text x="672" y="313.5" text-anchor="middle" font-size="11" font-weight="700" fill="#ec835a">!</text>
    <text x="135" y="305" class="box-main" fill="#a15c00">오해 1 · 가장 널리 퍼진 착각</text>
    <text x="135" y="327" class="box-sub">&quot;예금자보호가 안 되니까 위험한 상품이다&quot;</text>
    <text x="135" y="345" class="box-sub">라는 생각</text>
  </g>

  <!-- Box 5: 사실 (good) -->
  <g>
    <rect x="110" y="372" width="600" height="110" rx="8" fill="#f0faf0" stroke="#0ca30c"/>
    <rect x="110" y="372" width="6" height="110" rx="2" fill="#0ca30c"/>
    <circle cx="90" cy="427" r="15" fill="#0ca30c"/>
    <text x="90" y="432" text-anchor="middle" class="badge-num">5</text>
    <!-- check icon -->
    <circle cx="676" cy="397" r="13" fill="none" stroke="#0ca30c" stroke-width="2"/>
    <path d="M670,397 L674,402 L683,391" fill="none" stroke="#0ca30c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="135" y="396" class="box-main" fill="#006300">사실은 이렇습니다</text>
    <text x="135" y="420" class="box-sub">예금자보호법 대상이 아닌 건 맞지만,</text>
    <text x="135" y="440" class="box-sub">그게 곧 &quot;원금이 위험하다&quot;는 뜻은 아니에요</text>
    <text x="135" y="462" class="arrow-label">→ 오해를 하나씩 짚어보는 이야기, 다음 편에 계속됩니다</text>
  </g>
</svg>
